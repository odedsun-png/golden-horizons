name: Publish New Article

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Article slug (filename without .md)'
        required: true
        type: string
      markdown_content:
        description: 'Full markdown content including frontmatter'
        required: true
        type: string
      title:
        description: 'Article title (for commit message)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create articles directory
        run: mkdir -p src/content/articles

      - name: Write article file
        run: |
          cat > "src/content/articles/${{ inputs.slug }}.md" << 'EOF'
${{ inputs.markdown_content }}
EOF

      - name: Commit and push
        run: |
          git config user.name "Golden Horizons Bot"
          git config user.email "bot@ golden-horizons.netlify.app"
          
          git add "src/content/articles/${{ inputs.slug }}.md"
          git commit -m "Add: ${{ inputs.title || inputs.slug }}"
          git push
